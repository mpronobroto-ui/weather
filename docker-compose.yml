version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=weathergpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/SQL:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./BACKEND
    ports:
      - "8000:8000"
    env_file:
      - ./BACKEND/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DB=weathergpt
      - WIS2_ENABLE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./FRONTEND:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
